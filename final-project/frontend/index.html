<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digital Fitness Planner & Nutrition Coach</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand">
            🏋️ Digital Fitness Planner
        </a>
    </div>
</nav>

<div class="container mt-4">

    <!-- Dashboard Cards -->

    <div class="row">

        <div class="col-md-3 mb-3">
            <div class="card p-3 text-center shadow">
                <h5>BMI</h5>
                <h2 id="bmiValue">0</h2>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card p-3 text-center shadow">
                <h5>Calories</h5>
                <h2 id="calorieDisplay">0</h2>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card p-3 text-center shadow">
                <h5>Weight</h5>
                <h2 id="weightDisplay">0 kg</h2>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card p-3 text-center shadow">
                <h5>Water</h5>
                <h2 id="waterDisplay">0 L</h2>
            </div>
        </div>

    </div>

    <!-- Fitness Log -->

    <div class="row mt-4">

        <div class="col-md-6">

            <div class="card p-4 shadow">

                <h3>Daily Fitness Log</h3>

                <input type="number"
                       id="weight"
                       class="form-control mb-3"
                       placeholder="Weight (kg)">

                <input type="number"
                       id="height"
                       class="form-control mb-3"
                       placeholder="Height (cm)">

                <input type="number"
                       id="calories"
                       class="form-control mb-3"
                       placeholder="Calories">

                <input type="number"
                       id="water"
                       class="form-control mb-3"
                       placeholder="Water Intake (L)">

                <select id="activity"
                        class="form-control mb-3">

                    <option>Walking</option>
                    <option>Running</option>
                    <option>Cycling</option>
                    <option>Gym Workout</option>

                </select>

                <button class="btn btn-success"
                        onclick="saveFitnessData()">
                    Save Log
                </button>

            </div>

        </div>

        <!-- Workout Generator -->

        <div class="col-md-6">

            <div class="card p-4 shadow">

                <h3>Workout Generator</h3>

                <select id="goal"
                        class="form-control mb-3">

                    <option>Weight Loss</option>
                    <option>Muscle Gain</option>
                    <option>Maintenance</option>

                </select>

                <button class="btn btn-primary"
                        onclick="generateWorkout()">
                    Generate Workout
                </button>

                <div id="workoutResult"
                     class="mt-3">
                </div>

            </div>

        </div>

    </div>

    <!-- Weight Progress Analytics -->

    <div class="row mt-4">

        <div class="col-md-12">

            <div class="card p-4 shadow-lg rounded-4">

                <h2 class="text-primary">
                    📈 Weight Progress Analytics
                </h2>

                <p class="text-muted">
                    Track your weight journey over time
                </p>

                <canvas id="weightChart" height="100"></canvas>

            </div>

        </div>

    </div>

</div>

<script src="App.js"></script>

</body>
</html>
